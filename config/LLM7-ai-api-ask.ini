[Service]
Name=LLM7 AI - Fast Ask
Order=7
AutoSwapLanguage=0
ColorRecent=6307968
ValueType=Language

RealTimeTranslation=0
TranslateOnlyByButton=1
Visible=1
AllowProxy=1

[Service Description]
0=LLM7.io – Post Ask — this configuration sends a POST request to the LLM7.io chat completions endpoint, providing access to AI language models through an OpenAI-compatible API format. It can be used either with an API key (for higher rate limits) or anonymously without a key. Instead of translation, this configuration applies predefined action patterns (such as answering questions, summarizing, rewriting, generating ideas, and more) to the provided text. The selected pattern defines how the AI processes the input. The response is returned in a structure similar to chat-based AI APIs.
1=
2=Official website of the service: https://llm7.io
3=Here you can find documentation, available API features, and up-to-date information about limitations and usage terms.
4=
5=Without an API key (anonymous):
6=- Requests: 1 per second, 10 per minute, 60 per hour
7=- Token allowance: 500,000 tokens per 24 hours (input + output tokens combined)
8=
9=With a free API key:
10=- Requests: 2 per second, 40 per minute, 100 per hour
11=- Token allowance: 1,000,000 tokens per 24 hours (input + output tokens combined)
12=
13=Legal note: LLM7.io provides public gateway endpoints for free access, primarily intended for testing, experimentation, and low-frequency personal use. These services do not guarantee permanent stability, availability, or consistent behavior.
14=
15=The user is responsible for how this configuration is used. If you need a stable, production-ready, or commercial solution, it is recommended to use official APIs from established providers.

[Request]
Method=POST
EncryptText=1
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
EncodeText=0
Url=https://api.llm7.io/v1/chat/completions
ContentType=application/json; charset=utf-8
PostData={\r\n  "model": "fast",\r\n  "messages": [\r\n    {\r\n      "role": "system",\r\n      "content": "{prompt}"\r\n    },\r\n    {\r\n      "role": "user",\r\n      "content": "{data}"\r\n    }\r\n  ],\r\n  "temperature": 0.5\r\n}
Accept=*/*
MaxLength=0

[Response]
JsonPointer=/choices/0/message/content;/error/message

[Headers]
0=Connection=keep-alive
1=Authorization=Bearer {LLM7 API key or type anonymous}

[Parameters]
EncodeCustomParameters=0

[Custom Parameters]
prompt=Perform the requested action on the provided text. Return the result in the specified language; if the language is "auto", use the same language as the input. If the provided material does not match the requested action, respond in the user's language with: "It is not possible to perform the requested action with the provided data." Output only the result—no explanations, reasoning, or extra text. Do not use code blocks, Markdown tables, or any other formatting; return plain text only.
data=Action: {source}. Language: {target}. Material: {text}
LLM7 API key or type anonymous=

