[Script Parameters]
0=#//------------------------------------------------------------------------------
1=#// User script for text processing: normalize newlines and add markers(Pre-send)
2=#//------------------------------------------------------------------------------
3=#
4=#// Normalization of all line breaks to a single view (#10) and limiting
5=#// the number of consecutive breaks to a maximum of two.
6=#function NormalizeNewLines(const S: string): string;
7=#var
8=#  Temp: string;
9=#begin
10=#  Result := S;
11=#  if Result = '' then Exit;
12=#
13=#  // Bring all hyphenations to a single form (#10)
14=#  // At first CRLF -> LF
15=#  Result := ReplaceAll(Result, #13#10, #10, False);
16=#  // Then the rest CR -> LF
17=#  Result := ReplaceAll(Result, #13, #10, False);
18=#end;
19=#
20=#// Adding a text marker "\n" before each newline character.
21=#function AddNewLineMarkers(const S: string): string;
22=#begin
23=#  Result := S;
24=#  if Result = '' then Exit;
25=#
26=#  Result := ReplaceAll(Result, #10, '<br>', False);
27=#end;
28=#
29=#// Wrap recognized URLs in [url]...[/url] tags using a regular expression.
30=#function AddUrlTags(const S: string): string;
31=#begin
32=#  Result := S;
33=#  if Result = '' then Exit;
34=#  // Pattern matches http, https, ftp and www. links.
35=#  // Stop characters: whitespace, <, >, [, ]
36=#  Result := RegexReplace(Result,
37=#    '\b((https?|ftp)://|www\.)[^\s<>\[\]]+',
38=#    '[url]$0[/url]');
39=#end;
40=#
41=#//------------------------------------------------------------------------------
42=#// Main block – executed when the script runs
43=#//------------------------------------------------------------------------------
44=#var
45=#  txt: string;
46=#  originalTxt: string;
47=#begin
48=#  txt := GetParam('text');
49=#
50=#  txt := NormalizeNewLines(txt);
51=#
52=#  // Save a copy to check if AddUrlTags actually changed the text
53=#  originalTxt := txt;
54=#  txt := AddUrlTags(txt);
55=#
56=#  // Set isUrls flag: '1' if URLs were wrapped, '0' otherwise
57=#  if txt <> originalTxt then
58=#    SetOutput('hasUrl', '1')
59=#  else
60=#    SetOutput('hasUrl', '0');
61=#
62=#  txt := AddNewLineMarkers(txt);
63=#
64=#  SetOutput('text', txt);
65=#end.

[Script Response]
0=#//------------------------------------------------------------------------------
1=#// User script for response processing: clearing the response from [url][/url]
2=#//------------------------------------------------------------------------------
3=#
4=#var
5=#  txt: string;
6=#  hasUrl: string;
7=#begin
8=#  txt := GetParam('result');
9=#  if txt = '' then
10=#  begin
11=#    SetOutput('result', '');
12=#    Exit;
13=#  end;
14=#
15=#  // Check if URLs were wrapped in the pre-send script
16=#  hasUrl := GetParam('hasUrl');
17=#  if hasUrl = '1' then
18=#  begin
19=#    // Remove the opening and closing [url] tags
20=#    txt := ReplaceAll(txt, '[url]', '', False);
21=#    txt := ReplaceAll(txt, '[/url]', '', False);
22=#  end;
23=#
24=#  SetOutput('result', txt);
25=#end.
