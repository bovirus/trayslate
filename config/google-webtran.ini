[Service Description]
0=WebTran.eu — Google Translate PA (unofficial third‑party API key)
1=
2=This configuration uses the translate‑pa.googleapis.com/v1/translateHtml endpoint with an API key extracted from the public web interface of WebTran.eu (https://www.webtran.eu/). It sends a POST request containing the source language, target language, and input text, and returns the translated result by mimicking the exact network behaviour of the WebTran.eu website. The configuration includes all necessary headers (such as Origin, Referer, and X‑goog‑api‑key) to replicate a legitimate request from that service.
3=
4=Legal note: the API key embedded in this configuration is not issued to the end user — it belongs to the operator of WebTran.eu and is exposed in that site’s client‑side code. Using this key for automated or programmatic translation is not authorised by Google or by WebTran.eu, and almost certainly violates Google’s Terms of Service for the Google Translate service. The underlying endpoint is part of Google’s internal web interface, is not intended for third‑party integration, and may be restricted, rate‑limited, or shut down at any time without notice.
5=
6=This configuration is provided strictly for educational, experimental, and compatibility purposes only. For any legitimate, stable, or commercial use, you must obtain your own API key through the official Google Cloud Translation API, which guarantees authenticated access, documentation, and compliance with Google’s terms:
7=
8=https://cloud.google.com/translate
9=
10=The user is solely responsible for how this configuration is employed and must ensure full compliance with the terms of service of all involved services and any applicable laws.

