[Script Response]
0=#// Extract spelling errors from LanguageTool JSON and return a standard JSON array.
1=#var
2=#  jsonText: string;
3=#  handle: integer;
4=#  count: integer;
5=#  i: integer;
6=#  offsetVal: integer;
7=#  lengthVal: integer;
8=#  msg: string;
9=#  replCount: integer;
10=#  replStr: string;
11=#  j: integer;
12=#  replVal: string;
13=#begin
14=#  // Get the raw JSON response from the host application.
15=#  jsonText := GetParam('result');
16=#
17=#  // Parse the JSON and obtain a handle.
18=#  handle := JSONParse(jsonText);
19=#  if handle < 0 then
20=#  begin
21=#    // If parsing failed, return an empty array.
22=#    SetOutput('result', '[]');
23=#    Exit;
24=#  end;
25=#
26=#  // Initialize the result builder.
27=#  JSONResultInit;
28=#
29=#  // Process each match in the LanguageTool response.
30=#  count := JSONGetArrayCount(handle, 'matches');
31=#  for i := 0 to count - 1 do
32=#  begin
33=#    offsetVal := JSONGetInt(handle, 'matches[' + IntToStr(i) + '].offset');
34=#    lengthVal := JSONGetInt(handle, 'matches[' + IntToStr(i) + '].length');
35=#    msg := JSONGetString(handle, 'matches[' + IntToStr(i) + '].message');
36=#
37=#    // Build a pipe-separated string of replacement suggestions.
38=#    replStr := '';
39=#    replCount := JSONGetArrayCount(handle, 'matches[' + IntToStr(i) + '].replacements');
40=#    for j := 0 to replCount - 1 do
41=#    begin
42=#      replVal := JSONGetString(handle, 'matches[' + IntToStr(i) + '].replacements[' + IntToStr(j) + '].value');
43=#      if replStr <> '' then
44=#        replStr := replStr + '|';
45=#      replStr := replStr + replVal;
46=#    end;
47=#
48=#    // Add the extracted error to the result array.
49=#    JSONResultAddError(offsetVal, lengthVal, msg, replStr);
50=#  end;
51=#
52=#  // Release the parsed JSON.
53=#  JSONFree(handle);
54=#
55=#  // Return the standardized JSON array to the host.
56=#  SetOutput('result', JSONResultGet);
57=#end.

[Response]
JsonPointer=~

[Headers]
0=Connection=keep-alive

[Service Description]
0=LanguageTool (public API endpoint) — this configuration uses the public LanguageTool API to check spelling and grammar in text. It sends a POST request to `https://api.languagetool.org/v2/check` with parameters such as `language` and `text`, and returns a JSON response containing a list of matches. Each match includes the error's offset, length, a human-readable message, and suggested replacements. The API supports many languages and can be restricted to specific rule categories like `TYPOS` (spelling) or `GRAMMAR` via optional parameters.
1=
2=Legal note: the public endpoint is free of charge but subject to rate limiting (typically 20 requests per minute per IP) and is intended for non-commercial, low-volume use. It is not an officially documented service for production or commercial integration, and its availability or terms may change without notice. Automated or high-frequency access may be considered abuse and could be blocked.
3=
4=For legal and stable usage, it is recommended to either self-host a LanguageTool server (the software is open source and can be run locally or on your own infrastructure) or use the LanguageTool Premium API, which offers authenticated access, higher limits, and additional features:
5=
6=https://languagetool.org/
7=
8=The user is solely responsible for how this configuration is used and must ensure compliance with the service provider's terms, licensing conditions, and applicable regulations.
