[Service]
Name=Google Translate - Get Clients5
Order=2
AutoSwapLanguage=1
ColorRecent=12611584
ValueType=Language

RealTimeTranslation=1
TranslateOnlyByButton=0
Visible=1
AllowProxy=1

[Service Description]
0=Google Translate (Google clients5 dictionary endpoint) — this configuration uses an unofficial Google internal web endpoint (`clients5.google.com`) that is typically used by Chrome/Google services for dictionary-style translation requests. It sends a GET request containing source language, target language, and input text, and returns a JSON response with translated text data. The response is parsed directly from the root JSON array.
1=
2=Legal note: this endpoint is part of Google’s internal web infrastructure and is not publicly documented or officially supported for third-party integrations. Automated access to such internal endpoints may violate Google’s Terms of Service and can be blocked or changed without notice. Therefore, this configuration is provided strictly for educational, experimental, and compatibility purposes only.
3=
4=For stable, legal, and production usage, it is recommended to use the official Google Cloud Translation API, which provides authenticated access, documented behavior, and compliance with Google’s service terms:
5=
6=https://cloud.google.com/translate
7=
8=The user is solely responsible for ensuring proper and lawful use of this configuration in accordance with the service provider’s terms and applicable regulations.

[Request]
Method=GET
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
EncodeText=1
Url=https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl={source}&tl={target}&q={text}
Accept=application/json
MaxLength=16330

[Headers]
0=Connection=keep-alive

[Response]
JsonPointer={{\["([\s\S]*?)"\]}}!/0/0;/0/0

[Parameters]
EncodeCustomParameters=1

